<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Papertrail · PDF Extractor{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#202922;--muted:#748078;--line:#e6ebe7;--green:#1a724e;--pale:#eef7f1;--paper:#fbfcfa;--red:#a13d36}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"DM Sans",sans-serif;font-size:15px}.shell{max-width:980px;padding:0 28px;margin:0 auto}.topbar{height:78px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:11px;align-items:center;text-decoration:none;color:var(--ink);font-family:Manrope,sans-serif;font-weight:800;font-size:18px;letter-spacing:-.5px}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--green);color:white;font-size:19px}.top-note{color:var(--muted);font-size:13px}.hero{padding:70px 0 38px;max-width:640px}.eyebrow{color:var(--green);font-weight:700;font-size:10px;letter-spacing:1.6px;margin:0 0 12px}.hero h1,.detail-heading h1{font:800 clamp(38px,6vw,56px)/1.08 Manrope,sans-serif;letter-spacing:-2.8px;margin:0}.hero h1 span{color:var(--green)}.lede{font-size:16px;line-height:1.75;color:var(--muted);max-width:550px;margin:18px 0 0}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 8px 30px #203c2810}.section-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:23px}.section-heading h2,.error-panel h2{font:700 20px Manrope,sans-serif;letter-spacing:-.5px;margin:0}.section-heading .eyebrow{margin-bottom:7px}.limit,.count{font-size:12px;color:var(--muted);background:#f4f6f4;border-radius:100px;padding:7px 11px}.field-label{display:block;font-weight:600;font-size:13px;margin:18px 0 9px}.instructions-label{margin-top:24px}.field-label span{color:#9ba49e;font-weight:400;margin-left:5px}input[type=file],textarea{width:100%;font:14px "DM Sans",sans-serif;border:1px solid var(--line);border-radius:9px;background:#fcfdfc;padding:12px;color:var(--ink)}input[type=file]{padding:10px}textarea{resize:vertical;line-height:1.6}input:focus,textarea:focus{outline:2px solid #b5d9c1;border-color:var(--green)}.hint{font-size:12px;line-height:1.55;color:var(--muted);margin:8px 0 0}.button{display:inline-flex;align-items:center;gap:28px;background:var(--green);color:white;border:0;border-radius:9px;padding:13px 17px;font:600 13px "DM Sans",sans-serif;cursor:pointer;margin-top:20px;transition:background .15s}.button:hover{background:#125d3d}.button span{font-size:17px}.field-error,.error-box{color:var(--red);font-size:13px;margin:7px 0}.history{padding:53px 0 75px}.history .section-heading{margin-bottom:15px}.document-list{border-top:1px solid var(--line)}.document-row{display:flex;align-items:center;gap:14px;padding:16px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}.pdf-icon{display:grid;place-items:center;width:39px;height:43px;border-radius:8px;background:#fff1ed;color:#c44e43;font-size:9px;font-weight:800}.document-name{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}.document-name strong{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.document-name small,.detail-date{font-size:11px;color:var(--muted)}.status{font-size:11px;font-weight:600;padding:6px 9px;border-radius:100px}.status-completed{background:#e8f5ec;color:#267049}.status-failed{background:#fff0ed;color:#ac433b}.status-processing{background:#fff6df;color:#946c16}.status-uploaded{background:#eff1ef;color:#68726b}.row-arrow{color:#89948c}.empty-state{border:1px dashed #d9e2db;border-radius:12px;display:flex;align-items:center;flex-direction:column;padding:35px;color:var(--muted);font-size:13px}.empty-state strong{color:var(--ink);margin-top:10px}.empty-state p{margin:7px 0 0}.empty-icon{font-size:25px;color:var(--green)}.breadcrumb{margin:36px 0 30px}.breadcrumb a{color:var(--green);font-size:13px;text-decoration:none}.detail-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:25px}.detail-heading h1{font-size:32px;letter-spacing:-1.4px;overflow-wrap:anywhere}.detail-date{margin:10px 0 0}.result-panel{margin-bottom:16px}.json-output,.raw-text pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f9f7;border:1px solid var(--line);border-radius:9px;padding:18px;font:13px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;color:#294b39;margin:0}.error-panel{border-color:#f0d9d5;margin-bottom:16px}.error-panel p:not(.eyebrow){color:var(--red);line-height:1.6}.error-panel .button{margin-top:8px}.instructions-card{margin-bottom:16px}.instructions-card p:last-child{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:0}.raw-text{padding:14px 0 50px}.raw-text summary{font-size:13px;color:var(--muted);cursor:pointer;margin-bottom:12px}.raw-text pre{max-height:420px;overflow:auto;color:#53645a}.footer{border-top:1px solid var(--line);padding:22px 0;color:#9aa39d;font-size:11px}.footer .shell{display:flex;justify-content:space-between}@media(max-width:600px){.shell{padding:0 18px}.hero{padding-top:48px}.panel{padding:20px}.detail-heading{align-items:flex-start}.detail-heading h1{font-size:26px}.limit{display:none}.document-row{gap:10px}.status{font-size:10px}.footer .shell{gap:8px;flex-direction:column}}
  </style>
</head>
<body>
<header class="topbar shell"><a class="brand" href="{% url 'index' %}"><span class="brand-mark">✳</span> papertrail</a><span class="top-note">Your PDFs, organized.</span></header>
<main class="shell">{% block content %}{% endblock %}</main>
<footer class="footer"><div class="shell"><span>Papertrail · Private document workspace</span><span>PDF extraction powered by AI</span></div></footer>
</body>
</html>
